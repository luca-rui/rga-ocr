name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RGA_VERSION_UNIX: v0.10.10
  RGA_VERSION_WINDOWS: v0.10.9   # the last release with a Windows build
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # macos-latest (macos-26 arm64) gets no hosted runner in November 2026
            engine: vision
            extras: vision,test
          - os: macos-15            # macos-latest (macos-26 arm64) gets no hosted runner in November 2026
            engine: tesseract
            extras: tesseract,test
          - os: ubuntu-latest
            engine: rapidocr
            extras: rapidocr,test
          - os: ubuntu-latest
            engine: tesseract
            extras: tesseract,test
          - os: ubuntu-latest
            engine: auto           # only tesserocr installed, no tessdata: setup --apply must fetch it and auto must pick tesseract
            extras: tesseract,test
          - os: windows-latest
            engine: rapidocr
            extras: rapidocr,test
          - os: windows-latest
            engine: winocr
            extras: winocr,test   # the en-US OCR language pack is present on windows-latest
    env:
      RGA_OCR_ENGINE: ${{ matrix.engine }}
      TESSDATA_PREFIX: ${{ github.workspace }}/.tessdata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ripgrep, ripgrep-all, pandoc, poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep ripgrep-all pandoc poppler

      - name: Install ripgrep, pandoc, poppler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep pandoc poppler-utils

      - name: Install ripgrep-all from its release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin" rga-dl
          curl -sSL -o rga-dl/rga.tar.gz "https://github.com/phiresky/ripgrep-all/releases/download/$RGA_VERSION_UNIX/ripgrep_all-$RGA_VERSION_UNIX-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf rga-dl/rga.tar.gz -C rga-dl
          cp rga-dl/*/rga rga-dl/*/rga-preproc "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep, pandoc, poppler (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress ripgrep pandoc poppler

      - name: Install ripgrep-all from its release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/phiresky/ripgrep-all/releases/download/$env:RGA_VERSION_WINDOWS/ripgrep_all-$env:RGA_VERSION_WINDOWS-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path rga-dl | Out-Null
          Invoke-WebRequest -Uri $url -OutFile rga-dl\rga.zip
          Expand-Archive -Path rga-dl\rga.zip -DestinationPath rga-dl -Force
          $dir = (Get-ChildItem -Path rga-dl -Directory | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Cache Tesseract language files
        if: matrix.engine == 'tesseract'
        uses: actions/cache@v4
        with:
          path: .tessdata
          key: tessdata-fast-eng-deu

      - name: Fetch Tesseract language files
        if: matrix.engine == 'tesseract'
        shell: bash
        run: |
          mkdir -p .tessdata
          for l in eng deu; do
            [ -f ".tessdata/$l.traineddata" ] || curl -sSL -o ".tessdata/$l.traineddata" "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata"
          done

      - name: Install rga-ocr
        run: python -m pip install -q -e ".[${{ matrix.extras }}]"

      - name: Smoke test
        shell: bash
        run: |
          rga --version
          rg --version | head -1
          pandoc --version | head -1
          rga-ocr --version
          rga-ocr --engines
          # dry run exits 1 while the rga config lacks the adapters; --apply
          # writes them, warms the engine and checks rga lists them
          rga-ocr setup || true
          rga-ocr setup --apply
          rga --rga-list-adapters | sed -n '1,8p'   # sed drains stdin; head would SIGPIPE rga

      - name: Tests
        run: python -m pytest -q

  build:
    name: build / sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install -q build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/rga-ocr --version
          /tmp/clean/bin/rga-ocr --engines || true   # exit 1 is expected: no engine extra installed

      - name: No copyleft Python package comes along
        run: |
          /tmp/clean/bin/pip list
          if /tmp/clean/bin/pip list 2>/dev/null | grep -i -E "pymupdf|pillow.heif"; then
            echo "copyleft package found in the clean install" >&2
            exit 1
          fi

      - name: The pdf adapter extracts a text layer without an engine
        run: |
          /tmp/clean/bin/python -I tests/make_fixtures.py /tmp/fx
          /tmp/clean/bin/python -I -X utf8 -m rga_ocr.adapter pdf textlayer.pdf < /tmp/fx/textlayer.pdf | grep -c "Wartungsvertrag Kesselanlage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

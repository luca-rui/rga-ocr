name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays: the dependencies are open floors, so a new release of one of
    # them is met here and not first by someone who installs
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a new push to a pull request takes the place of the run before it. Runs
  # on main are never cancelled: release.yml asks for the green run of the
  # tagged commit.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  RGA_VERSION_UNIX: v0.10.10
  RGA_VERSION_WINDOWS: v0.10.9   # the last release with a Windows build
  # SHA-256 of the two release archives; change them with the versions
  RGA_SHA256_UNIX: a969c25b182ac84aa672518313b5f741091decf7d93d03a020bcfe517b9ff4e8      # x86_64-unknown-linux-musl.tar.gz
  RGA_SHA256_WINDOWS: da03e969ac01839443739c547ca8eb521e648e712251d61a98d34a1521b9f43b   # x86_64-pc-windows-msvc.zip
  # tessdata_fast has no releases: a commit and the sums of the two files
  TESSDATA_COMMIT: 87416418657359cb625c412a48b6e1d6d41c29bd
  TESSDATA_SHA256_ENG: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
  TESSDATA_SHA256_DEU: 19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d
  PYTHONUTF8: "1"

jobs:
  test:
    # The ruleset of main requires the jobs of this workflow by their exact
    # names (macos-15 / vision, ubuntu-latest / tesseract / python 3.11,
    # build / sdist and wheel, lint / ruff ...). A renamed or removed job
    # blocks every merge until the ruleset is changed with it; a leg added
    # later carries a label or a new os/engine pair and is added there too.
    name: ${{ matrix.label || format('{0} / {1}', matrix.os, matrix.engine) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # macos-latest (macos-26 arm64) gets no hosted runner in November 2026
            engine: vision
            extras: vision,test
          - os: macos-15            # macos-latest (macos-26 arm64) gets no hosted runner in November 2026
            engine: tesseract
            extras: tesseract,test
          - os: ubuntu-latest
            engine: rapidocr
            extras: rapidocr,test
          - os: ubuntu-latest
            engine: tesseract
            extras: tesseract,test
          - os: ubuntu-latest
            engine: auto           # only tesserocr installed, no tessdata: setup --apply must fetch it and auto must pick tesseract
            extras: tesseract,test
          - os: windows-latest
            engine: rapidocr
            extras: rapidocr,test
          - os: windows-latest
            engine: winocr
            extras: winocr,test   # the en-US OCR language pack is present on windows-latest
          - os: macos-15
            engine: rapidocr
            extras: rapidocr,test
          - os: windows-latest
            engine: tesseract
            extras: tesseract,test
          - os: ubuntu-latest
            engine: tesseract
            extras: tesseract,test
            python: "3.11"
            label: ubuntu-latest / tesseract / python 3.11
          - os: ubuntu-latest
            engine: tesseract
            extras: tesseract,test
            python: "3.14"
            label: ubuntu-latest / tesseract / python 3.14
          - os: ubuntu-latest
            engine: rapidocr
            extras: rapidocr,test
            python: "3.11"          # the oldest supported Python: the floors have wheels for it
            minimum: true           # core, rapidocr and test dependencies at the floor pyproject.toml names
            label: ubuntu-latest / rapidocr / minimum versions
          # Not required checks until the ruleset names them: see the
          # comment at `name`. The first is what the Homebrew formula
          # ships: macOS, Python 3.14, Vision.
          - os: macos-15
            engine: vision
            extras: vision,test
            python: "3.14"
            label: macos-15 / vision / python 3.14
          - os: ubuntu-latest
            engine: rapidocr
            extras: rapidocr,test
            python: "3.13"
            label: ubuntu-latest / rapidocr / python 3.13
    env:
      RGA_OCR_ENGINE: ${{ matrix.engine }}
      TESSDATA_PREFIX: ${{ github.workspace }}/.tessdata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python || '3.12' }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ripgrep, ripgrep-all, pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep ripgrep-all pandoc

      - name: Install ripgrep, pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep pandoc

      - name: Install ripgrep-all from its release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin" rga-dl
          python tools/fetch_verified.py "$RGA_SHA256_UNIX" rga-dl/rga.tar.gz "https://github.com/phiresky/ripgrep-all/releases/download/$RGA_VERSION_UNIX/ripgrep_all-$RGA_VERSION_UNIX-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf rga-dl/rga.tar.gz -C rga-dl
          cp rga-dl/*/rga rga-dl/*/rga-preproc "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep, pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco exits 0 even when its feed fails for one package (seen
          # 2026-11-18: 504 for one of them), so check what is installed and
          # retry once
          $pkgs = 'ripgrep', 'pandoc'
          foreach ($attempt in 1..2) {
            choco install -y --no-progress @pkgs
            $have = choco list --limit-output | ForEach-Object { ($_ -split '\|')[0] }
            $missing = @($pkgs | Where-Object { $_ -notin $have })
            if ($missing.Count -eq 0) { break }
            Write-Host "attempt ${attempt}: not installed: $($missing -join ', ')"
            if ($attempt -eq 1) { Start-Sleep -Seconds 20 }
          }
          if ($missing.Count -gt 0) {
            Write-Error "choco did not install: $($missing -join ', ')"
            exit 1
          }

      - name: Install ripgrep-all from its release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/phiresky/ripgrep-all/releases/download/$env:RGA_VERSION_WINDOWS/ripgrep_all-$env:RGA_VERSION_WINDOWS-x86_64-pc-windows-msvc.zip"
          python tools/fetch_verified.py $env:RGA_SHA256_WINDOWS rga-dl\rga.zip $url
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive -Path rga-dl\rga.zip -DestinationPath rga-dl -Force
          $dir = (Get-ChildItem -Path rga-dl -Directory | Select-Object -First 1).FullName
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Cache Tesseract language files
        if: matrix.engine == 'tesseract'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tessdata
          key: tessdata-fast-eng-deu-${{ env.TESSDATA_COMMIT }}

      - name: Fetch Tesseract language files
        if: matrix.engine == 'tesseract'
        shell: bash
        run: |
          # a file restored from the cache is checked like a fresh download
          base="https://github.com/tesseract-ocr/tessdata_fast/raw/$TESSDATA_COMMIT"
          python tools/fetch_verified.py "$TESSDATA_SHA256_ENG" .tessdata/eng.traineddata "$base/eng.traineddata"
          python tools/fetch_verified.py "$TESSDATA_SHA256_DEU" .tessdata/deu.traineddata "$base/deu.traineddata"

      - name: Install rga-ocr
        if: ${{ !matrix.minimum }}
        run: python -m pip install -q -e ".[${{ matrix.extras }}]"

      - name: Install rga-ocr with its direct dependencies at their floor
        if: ${{ matrix.minimum }}
        shell: bash
        run: |
          python tools/min_constraints.py > constraints-min.txt
          cat constraints-min.txt
          python -m pip install -q -c constraints-min.txt -e ".[${{ matrix.extras }}]"
          python -m pip list

      - name: Smoke test
        shell: bash
        run: |
          rga --version
          rg --version | head -1
          pandoc --version | head -1
          rga-ocr --version
          # dry run exits 1 while the rga config lacks the adapters; --apply
          # writes them, warms the engine and checks rga lists them
          rga-ocr setup || true
          rga-ocr setup --apply
          # after setup: on the auto leg no engine works before --apply has
          # fetched the language files, and --engines then exits 1
          rga-ocr --engines
          rga --rga-list-adapters | sed -n '1,8p'   # sed drains stdin; head would SIGPIPE rga

      - name: The installed tools extract text
        # default shell, the same as the tests, so both resolve the same
        # binaries
        run: python tools/check_tools.py

      - name: Tests
        run: python -m pytest -q

  lint:
    name: lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: ruff check
        # the rule set is in pyproject.toml; the version is pinned so a new
        # ruff cannot turn the job red on its own
        run: |
          python -m pip install -q ruff==0.17.5
          ruff check .

      - name: Version and changelog agree
        # a release pull request that sets VERSION and forgets the
        # changelog fails here, before a tag exists
        run: python tools/release_check.py consistency

  build:
    name: build / sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install -q build twine
          python -m build
          twine check --strict dist/*

      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/rga-ocr --version
          /tmp/clean/bin/rga-ocr --engines || true   # exit 1 is expected: no engine extra installed

      - name: A copy in the user site-packages starts its adapter
        # `pip install --user`: the adapter's -I would hide the package
        run: |
          python -m pip install -q --user dist/*.whl
          cd /tmp
          python -c "
          import sys
          from rga_ocr import setup_cmd as sc
          assert sc.in_user_site(), sc.__file__
          assert sc.adapter_args()[0] == '-P', sc.adapter_args()
          sys.exit(0 if sc.adapter_starts(sc.Out()) else 1)"
          python -m pip uninstall -q -y rga-ocr

      - name: No copyleft Python package comes along
        run: |
          /tmp/clean/bin/pip list
          if /tmp/clean/bin/pip list 2>/dev/null | grep -i -E "pymupdf|pillow.heif"; then
            echo "copyleft package found in the clean install" >&2
            exit 1
          fi

      - name: Every dependency, extras included, is permissively licensed
        run: |
          set -o pipefail    # a failure left of a pipe fails the step
          python -m venv /tmp/extras
          /tmp/extras/bin/pip install -q "$(ls dist/*.whl)[rapidocr,tesseract]"
          python -m pip install -q pip-licenses
          pip-licenses --python /tmp/extras/bin/python --format=csv | tee /tmp/licences.csv
          python tools/check_licences.py < /tmp/licences.csv

      - name: The sdist carries the tests and they pass from it
        run: |
          mkdir /tmp/sdist
          tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          test -f /tmp/sdist/tests/conftest.py
          test -f /tmp/sdist/tests/make_fixtures.py
          test -f /tmp/sdist/tests/data/shot.heic
          /tmp/clean/bin/pip install -q "pytest>=8"
          cd /tmp/sdist
          /tmp/clean/bin/python -m pytest -q tests/test_adapter.py tests/test_cli.py tests/test_setup.py

      - name: The pdf adapter extracts a text layer without an engine
        run: |
          /tmp/clean/bin/python -I tests/make_fixtures.py /tmp/fx
          /tmp/clean/bin/python -I -X utf8 -m rga_ocr.adapter pdf textlayer.pdf < /tmp/fx/textlayer.pdf | grep -c "Wartungsvertrag Kesselanlage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

name: release

# A pushed v* tag publishes to PyPI and creates the GitHub release. A manual
# run publishes the chosen ref to TestPyPI and never touches PyPI. Both use
# trusted publishing (OIDC): there is no API token in this repository.
#
# PyPI ties the trusted publisher to this file's name and to the
# environments pypi and testpypi: renaming either breaks the upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the tag check asks for the ci run of the commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check below needs the history of main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The tag matches the version and the changelog, is on main, and ci is green there
        # tests/test_release_check.py covers the script; ci.yml runs its
        # `consistency` part on every pull request. A run of ci that is
        # still going is waited for (40 minutes). After a red or cancelled
        # run: re-run its failed jobs, then re-run this workflow.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_check.py tag "$GITHUB_REF_NAME"

      - name: Build
        run: |
          python -m pip install -q build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # a re-run after a failure further down does not stop at the
          # files that are already there
          skip-existing: true

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
            exit 0
          fi
          python3 tools/release_check.py notes > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "rga-ocr ${GITHUB_REF_NAME#v}" --notes-file notes.md

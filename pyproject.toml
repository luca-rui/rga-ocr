[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rga-ocr"
dynamic = ["version"]
description = "Search file names and contents beneath a path, OCR for PDFs and images included, through ripgrep-all"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Luca Rui"}]
keywords = ["ripgrep-all", "rga", "ocr", "search", "grep", "pdf", "scans", "heic", "cli",
            "apple-vision", "tesseract", "rapidocr", "windows-ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4",
    "pillow>=10.1",
    # no wheels for Python 3.15 or for Windows on arm64 yet: without them a
    # pip install would try to build libheif. HEIC is not read there.
    "pi-heif>=0.22; python_version < '3.15' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
vision = [
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
winocr = [
    "winrt-runtime>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0.1; sys_platform == 'win32'",
]
rapidocr = [
    "rapidocr>=3.10",
    "onnxruntime>=1.19",
]
tesseract = [
    "tesserocr>=2.7",
]
test = [
    "pytest>=8",
]

[project.scripts]
rga-ocr = "rga_ocr.cli:run"

[project.urls]
Homepage = "https://github.com/luca-rui/rga-ocr"
Repository = "https://github.com/luca-rui/rga-ocr"
Issues = "https://github.com/luca-rui/rga-ocr/issues"
Changelog = "https://github.com/luca-rui/rga-ocr/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rga_ocr.VERSION"}

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# named here, so the set does not move with ruff's defaults
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]   # `l` is a language tag or a line throughout

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
